<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DO NOT CLICK</title>
<style>
  html, body { margin:0; padding:0; background:#000; overflow:hidden; height:100%; }
  video {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    object-fit: contain; background:#000;
  }
  #unmute {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: system-ui, sans-serif;
    font-size: 1.2rem; background: rgba(0,0,0,0.3);
    cursor: pointer; z-index: 10;
  }
</style>
</head>
<body>
<video id="v" autoplay muted loop playsinline>
  <source src="rickroll.mp4" type="video/mp4">
</video>
<div id="unmute">🔊 Tap for sound</div>

<script>
  const v = document.getElementById('v');
  const overlay = document.getElementById('unmute');

  v.play().catch(() => {});

  const unlock = async () => {
    v.muted = false;
    v.volume = 1;
    try { await v.requestFullscreen?.(); } catch(e) {}
    overlay.style.display = 'none';
    document.removeEventListener('click', unlock);
    document.removeEventListener('keydown', unlock);
    document.removeEventListener('touchstart', unlock);
  };
  document.addEventListener('click', unlock);
  document.addEventListener('keydown', unlock);
  document.addEventListener('touchstart', unlock);
</script>
</body>
</html>
