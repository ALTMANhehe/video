<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUMBASS</title>
<style>
  html, body {
    margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%;
  }
  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #000; color: #fff;
    font-family: system-ui, sans-serif; font-size: 1.5rem;
    cursor: pointer; z-index: 10;
  }
  video {
    position: fixed; inset: 0;
    width: 100vw; height: 100vh;
    object-fit: contain; background: #000;
    display: none; z-index: 5;
  }
</style>
</head>
<body>

<div id="overlay">Click to continue</div>
<video id="v" playsinline>
  <source src="rickroll.mp4" type="video/mp4">
</video>

<script>
  const overlay = document.getElementById('overlay');
  const video = document.getElementById('v');

  overlay.addEventListener('click', async () => {
    overlay.style.display = 'none';
    video.style.display = 'block';

    try {
      if (video.requestFullscreen) await video.requestFullscreen();
      else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
    } catch (e) {}

    video.play();

    video.onended = () => {
      document.exitFullscreen?.();
      window.close();
      setTimeout(() => {
        document.body.innerHTML = '<div style="color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;">Done.</div>';
      }, 100);
    };

    setTimeout(() => {
      video.pause();
      document.exitFullscreen?.();
    }, 90000);
  });
</script>
</body>
</html>
